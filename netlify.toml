[build]
  command = "make"
  publish = "public"
  functions = "netlify/functions"

[[plugins]]
  package = "netlify-plugin-cache"

  [plugins.inputs]
  paths = ["bin/hugo-x64"]

[[headers]]
  for = "/.well-known/webfinger"
  [headers.values]
    Content-Type = "application/jrd+json"
    Access-Control-Allow-Origin = "*"
